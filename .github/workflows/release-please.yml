name: release-please

on:
  push:
    branches:
      - main

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - name: Generate token
        id: generate-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - uses: googleapis/release-please-action@v5
        id: release
        with:
          token: ${{ steps.generate-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - uses: actions/checkout@v6
        if: steps.release.outputs.prs_created == 'true'
        with:
          token: ${{ steps.generate-token.outputs.token }}

      - name: Check out release branch
        if: steps.release.outputs.prs_created == 'true'
        env:
          RELEASE_OUTPUTS: ${{ toJson(steps.release.outputs) }}
        run: |
          set -euo pipefail

          RELEASE_BRANCH="$(
            printf '%s' "$RELEASE_OUTPUTS" | jq -r '
              if (.prs // "") != "" then
                (.prs | fromjson)[0].headBranchName
              elif (.pr // "") != "" then
                (.pr | fromjson).headBranchName
              else
                error("release-please reported prs_created but returned no PR metadata")
              end
            '
          )"
          echo "RELEASE_BRANCH=${RELEASE_BRANCH}" >> "$GITHUB_ENV"
          git fetch origin "refs/heads/${RELEASE_BRANCH}:refs/remotes/origin/${RELEASE_BRANCH}"
          git checkout --track -B "${RELEASE_BRANCH}" "refs/remotes/origin/${RELEASE_BRANCH}"

      - name: Setup Bun
        if: steps.release.outputs.prs_created == 'true'
        uses: oven-sh/setup-bun@v2

      - name: Sync bun.lock
        if: steps.release.outputs.prs_created == 'true'
        run: |
          set -euo pipefail

          # remove bun.lock to force it to find any workspace updates (https://github.com/oven-sh/bun/issues/18906)
          rm bun.lock && bun install --lockfile-only
          if git diff --quiet bun.lock; then
            echo "bun.lock already in sync"
          else
            # We use the GitHub App token's bot identity to author the amend
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add bun.lock
            git commit --amend --no-edit
            git push --force-with-lease
          fi
