name: Deploy to Cloud Run

on:
  push:
    tags:
      - 'apps/**-v*'
  workflow_dispatch:
    inputs:
      component:
        description: 'Component to deploy (api, dashboard, indexer)'
        required: true
        default: 'api'
      version:
        description: 'Version tag (e.g., v0.1.1)'
        required: true
        default: 'latest'

env:
  VPC_CONNECTOR: ${{ secrets.GCP_VPC_CONNECTOR }}
  REPO: sentinel-repo
  DB_NAME: sentinel-db
  DB_URN: sentinel
  EVE_PACKAGE_ID_STILLNESS: '0x28b497559d65ab320d9da4613bf2498d5946b2c0ae3597ccfda3072ce127448c,0xd2fd1224f881e7a705dbc211888af11655c315f2ee0f03fe680fc3176e6e4780'
  SUI_NETWORK: testnet

jobs:
  parse-tag:
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      component: ${{ steps.parse.outputs.component }}
      version: ${{ steps.parse.outputs.version }}
      should_deploy: ${{ steps.parse.outputs.should_deploy }}
    steps:
      - id: parse
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "component=${{ github.event.inputs.component }}" >> $GITHUB_OUTPUT
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
            echo "should_deploy=true" >> $GITHUB_OUTPUT
          else
            # Tag format: apps/api-v0.1.1 or packages/shared-types-v0.1.1
            TAG=${{ github.ref_name }}

            # Extract everything before the last '-v'
            COMPONENT_PATH=$(echo $TAG | sed -E 's/-v[0-9]+\.[0-9]+\.[0-9]+.*$//')
            # Extract the component name (last part of the path)
            COMPONENT=$(echo $COMPONENT_PATH | rev | cut -d'/' -f1 | rev)
            # Extract the version (everything after the last '-v')
            VERSION=$(echo $TAG | sed -E 's/^.*-v//')

            echo "component=$COMPONENT" >> $GITHUB_OUTPUT
            echo "version=v$VERSION" >> $GITHUB_OUTPUT

            # Only deploy if it's in the 'apps/' directory
            if [[ "$TAG" == apps/* ]]; then
              echo "should_deploy=true" >> $GITHUB_OUTPUT
            else
              echo "should_deploy=false" >> $GITHUB_OUTPUT
            fi
          fi

  deploy:
    needs: parse-tag
    if: needs.parse-tag.outputs.should_deploy == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Docker Auth
        run: |-
          gcloud auth configure-docker ${{ secrets.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Build and Push Image
        run: |
          COMPONENT=${{ needs.parse-tag.outputs.component }}
          VERSION=${{ needs.parse-tag.outputs.version }}
          # Determine path for indexer which is not in the tag path for shared types
          if [[ "$COMPONENT" == "api" ]]; then DOCKERFILE="apps/api/Dockerfile"; fi
          if [[ "$COMPONENT" == "dashboard" ]]; then DOCKERFILE="apps/dashboard/Dockerfile"; fi
          if [[ "$COMPONENT" == "indexer" ]]; then DOCKERFILE="apps/indexer/Dockerfile"; fi

          # Skip shared-types as it doesn't have a Dockerfile
          if [[ "$COMPONENT" != "shared-types" ]]; then
            IMAGE_URL="${{ secrets.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT }}/${{ env.REPO }}/${COMPONENT}:${VERSION}"
            docker build -t ${IMAGE_URL} -f ${DOCKERFILE} \
              --build-arg SENTINEL_BUILD_COMMIT="${{ github.sha }}" \
              --build-arg SENTINEL_BUILD_DIRTY="false" \
              --build-arg SENTINEL_BUILD_REPOSITORY_URL="${{ github.server_url }}/${{ github.repository }}" \
              --build-arg SENTINEL_BUILD_RELEASE_TAG="${VERSION}" \
              .
            docker push ${IMAGE_URL}
          fi

      - name: Deploy API
        if: needs.parse-tag.outputs.component == 'api'
        env:
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASS: ${{ secrets.DB_PASS }}
        run: |
          gcloud run deploy api \
            --image ${{ secrets.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT }}/${{ env.REPO }}/api:${{ needs.parse-tag.outputs.version }} \
            --region ${{ secrets.GCP_REGION }} \
            --project ${{ secrets.GCP_PROJECT }} \
            --vpc-connector=${{ secrets.GCP_VPC_CONNECTOR }} \
            --add-cloudsql-instances ${{ secrets.GCP_PROJECT }}:${{ secrets.GCP_REGION }}:${{ env.DB_NAME }} \
            --set-env-vars="^__^DATABASE_URL=postgres://${DB_USER}:${DB_PASS}@/${{ env.DB_URN }}?host=/cloudsql/${{ secrets.GCP_PROJECT }}:${{ secrets.GCP_REGION }}:${{ env.DB_NAME }}" \
            --allow-unauthenticated \
            --port 3001

      - name: Deploy Indexer
        if: needs.parse-tag.outputs.component == 'indexer'
        env:
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASS: ${{ secrets.DB_PASS }}
        run: |
          EVE_PACKAGE_ID="${{ env.EVE_PACKAGE_ID_STILLNESS }}"
          gcloud run deploy indexer \
            --image ${{ secrets.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT }}/${{ env.REPO }}/indexer:${{ needs.parse-tag.outputs.version }} \
            --region ${{ secrets.GCP_REGION }} \
            --project ${{ secrets.GCP_PROJECT }} \
            --vpc-connector=${{ secrets.GCP_VPC_CONNECTOR }} \
            --add-cloudsql-instances ${{ secrets.GCP_PROJECT }}:${{ secrets.GCP_REGION }}:${{ env.DB_NAME }} \
            --set-env-vars="^__^DATABASE_URL=postgres://${DB_USER}:${DB_PASS}@/${{ env.DB_URN }}?host=/cloudsql/${{ secrets.GCP_PROJECT }}:${{ secrets.GCP_REGION }}:${{ env.DB_NAME }}__SUI_RPC_URL=https://fullnode.${{ env.SUI_NETWORK }}.sui.io__EVE_PACKAGE_ID=${EVE_PACKAGE_ID}" \
            --min-instances 1 \
            --allow-unauthenticated \
            --port 8080

      - name: Deploy Dashboard
        if: needs.parse-tag.outputs.component == 'dashboard'
        run: |
          API_URL=$(gcloud run services describe api --region ${{ secrets.GCP_REGION }} --format="value(status.url)")
          gcloud run deploy dashboard \
            --image ${{ secrets.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT }}/${{ env.REPO }}/dashboard:${{ needs.parse-tag.outputs.version }} \
            --region ${{ secrets.GCP_REGION }} \
            --project ${{ secrets.GCP_PROJECT }} \
            --vpc-connector=${{ secrets.GCP_VPC_CONNECTOR }} \
            --set-env-vars API_PROXY_URL=$API_URL,GRAPHQL_PROXY_URL=https://graphql.${{ env.SUI_NETWORK }}.sui.io \
            --allow-unauthenticated \
            --port 5173
