[package]
name = "sentinel-indexer"
version = "0.1.1"
edition = "2021"

[dependencies]
anyhow = "1.0.97"
chrono = { version = "0.4.40", features = ["serde"] }
diesel = { version = "2.3.9", default-features = false, features = ["postgres_backend", "chrono", "serde_json"] }
reqwest = { version = "0.12.15", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
tokio = { version = "1.52.2", features = ["macros", "rt-multi-thread", "time", "net", "io-util"] }
tokio-postgres = { version = "0.7.17", features = ["with-chrono-0_4", "with-serde_json-1"] }
