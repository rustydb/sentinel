[package]
name = "sentinel-indexer"
version = "0.1.1"
edition = "2021"

[dependencies]
anyhow = "1.0.97"
chrono = { version = "0.4.45", features = ["serde"] }
diesel = { version = "2.3.10", default-features = false, features = ["postgres_backend", "chrono", "serde_json"] }
reqwest = { version = "0.12.15", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.150"
tokio = { version = "1.52.3", features = ["macros", "rt-multi-thread", "time", "net", "io-util"] }
tokio-postgres = { version = "0.7.17", features = ["with-chrono-0_4", "with-serde_json-1"] }
deadpool-postgres = { version = "0.14", features = ["rt_tokio_1"] }
