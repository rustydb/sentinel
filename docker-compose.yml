name: sentinel-dev

services:
  postgres:
    image: docker.io/library/postgres:18-alpine
    environment:
      POSTGRES_DB: sentinel
      POSTGRES_USER: sentinel
      POSTGRES_PASSWORD: sentinel
    ports:
      - "5432:5432"
    volumes:
      - postgres-dev-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentinel -d sentinel"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    image: docker.io/oven/bun:1.3.14
    working_dir: /app
    command:
      - sh
      - -c
      - bun install && bun run --filter @sentinel/api dev
    environment:
      PORT: 3001
      DATABASE_URL: postgres://sentinel:sentinel@postgres:5432/sentinel
      CHOKIDAR_USEPOLLING: "true"
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3001:3001"
    volumes:
      - .:/app
      - bun-install-cache:/root/.bun/install/cache

  dashboard:
    build:
      context: .
      dockerfile: apps/dashboard/Dockerfile.dev
    working_dir: /app
    command:
      - sh
      - -c
      - bun install && cd apps/dashboard && bunx vite --host 0.0.0.0 --port 5173
    environment:
      CHOKIDAR_USEPOLLING: "true"
      VITE_API_PROXY_TARGET: http://api:3001
      VITE_GRAPHQL_PROXY_TARGET: https://graphql.testnet.sui.io
    depends_on:
      - api
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - bun-install-cache:/root/.bun/install/cache

  indexer:
    image: docker.io/library/rust:1.95
    working_dir: /app
    command:
      - cargo
      - run
      - --manifest-path
      - apps/indexer/Cargo.toml
    environment:
      DATABASE_URL: postgres://sentinel:sentinel@postgres:5432/sentinel
      SUI_RPC_URL: https://fullnode.testnet.sui.io
      EVE_PACKAGE_ID: ${EVE_PACKAGE_ID:-0x28b497559d65ab320d9da4613bf2498d5946b2c0ae3597ccfda3072ce127448c,0xd2fd1224f881e7a705dbc211888af11655c315f2ee0f03fe680fc3176e6e4780}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - .:/app
      - cargo-registry-cache:/usr/local/cargo/registry
      - cargo-git-cache:/usr/local/cargo/git
      - cargo-target-cache:/app/apps/indexer/target

volumes:
  postgres-dev-data:
  bun-install-cache:
  cargo-registry-cache:
  cargo-git-cache:
  cargo-target-cache:
