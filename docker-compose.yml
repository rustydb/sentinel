services:
  postgres:
    image: docker.io/library/postgres:16-alpine
    container_name: sentinel-postgres
    environment:
      POSTGRES_DB: sentinel
      POSTGRES_USER: sentinel
      POSTGRES_PASSWORD: sentinel
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentinel -d sentinel"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    image: localhost/frontier_api:latest
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      PORT: 3001
      DATABASE_URL: postgres://sentinel:sentinel@postgres:5432/sentinel
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3001:3001"

  dashboard:
    image: localhost/frontier_dashboard:latest
    build:
      context: .
      dockerfile: apps/dashboard/Dockerfile
    environment:
      VITE_GRAPHQL_URL: /graphql
      API_PROXY_URL: http://api:3001
      GRAPHQL_PROXY_URL: https://graphql.testnet.sui.io
    depends_on:
      - api
    ports:
      - "5173:5173"

  indexer:
    image: localhost/frontier_indexer:latest
    build:
      context: .
      dockerfile: apps/indexer/Dockerfile
    environment:
      DATABASE_URL: postgres://sentinel:sentinel@postgres:5432/sentinel
      SUI_RPC_URL: https://fullnode.testnet.sui.io
      EVE_PACKAGE_ID: ${EVE_PACKAGE_ID:-0xd12a70c74c1e759445d6f209b01d43d860e97fcf2ef72ccbbd00afd828043f75,0x28b497559d65ab320d9da4613bf2498d5946b2c0ae3597ccfda3072ce127448c}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
